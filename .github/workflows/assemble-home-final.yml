name: Assemble HOME_FINAL transfer

on:
  push:
    branches:
      - home-final-literal-transfer
    paths:
      - .github/workflows/assemble-home-final.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home-final-literal-transfer
      - name: Reconstruct exact Codex files
        shell: bash
        run: |
          set -euo pipefail
          cat transfer/index.part{1,2,3,4,5}.b64 | base64 -d | gzip -dc > index.html
          cat transfer/home.test.js.gz.b64 | base64 -d | gzip -dc > home.test.js
          echo '99f3bccbd89921b7595ac3cbc06a239641465754a78d586ee9e99fd3588eee2d  index.html' | sha256sum -c -
          echo '171081d2d54b6b14922b87e27dd6c7961cc36842dbbd92f532033c5e2bfc2d2a  home.test.js' | sha256sum -c -
          node home.test.js
      - name: Commit reconstructed files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html home.test.js
          git commit -m 'Implement literal approved HOME_FINAL'
          git push origin HEAD:home-final-literal-transfer
